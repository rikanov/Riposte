name: Riposte CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: CMake, GCC, RPM setup (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install build-essential cmake rpm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: default compile
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: gradle compileKotlinDesktop

      - name: Build Native Engine (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p app/src/desktopMain/resources
          cd app/src/cpp
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make
          cp libriposte.so ../../desktopMain/resources/

      - name: Build Native Engine (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path app\src\desktopMain\resources
          cd app\src\cpp
          New-Item -ItemType Directory -Force -Path build
          cd build
          cmake ..
          cmake --build . --config Release
          Copy-Item "Release\riposte.dll" -Destination "..\..\desktopMain\resources\"

      - name: generate installers (KMP Desktop)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle packageDistributionForCurrentOS

      - name: Decode Android Keystore
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: generate signed Android APK & AAB
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        run: >
          gradle :app:assembleRelease :app:bundleRelease
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/compose/binaries/main/**/*.msi
            app/build/compose/binaries/main/**/*.exe
            app/build/compose/binaries/main/**/*.deb
            app/build/compose/binaries/main/**/*.rpm
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
