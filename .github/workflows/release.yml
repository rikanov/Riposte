name: Riposte CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Kód letöltése (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: CMake & GCC setup for Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install build-essential cmake rpm

      - name: Gradle Build (Ellenőrzés)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: compileKotlinDesktop

  package-and-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Csomagolás indítása (Linux/Windows)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: packageDistributionForCurrentOS

      - name: Telepítők összegyűjtése és feltöltése a GitHub Release-be
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/compose/binaries/main/*/*.msi
            app/build/compose/binaries/main/*/*.exe
            app/build/compose/binaries/main/*/*.deb
            app/build/compose/binaries/main/*/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
